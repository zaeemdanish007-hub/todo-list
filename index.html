<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>To-Do List</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="card">
      <div class="container">
        <h1>My To-Do List</h1>
        <p>Add your items here ⏬</p>
      </div>

      <div class="input">
        <input type="text" placeholder="Add your item here..." />
        <button class="submit">Submit</button>
      </div>

      <!-- Tasks -->
      <div class="items">
        <h5>Your Tasks</h5>

        <ul>
          <li>
            <p>React</p>

            <div>
              <button class="check">
                <i class="fa-solid fa-check" style="color: green"></i>
              </button>

              <button class="delete">
                <i class="fa-solid fa-trash" style="color: red"></i>
              </button>
            </div>
          </li>

          <li>
            <p class="completed">Gym</p>

            <div>
              <button class="check">
                <i class="fa-solid fa-check" style="color: green"></i>
              </button>

              <button class="delete">
                <i class="fa-solid fa-trash" style="color: red"></i>
              </button>
            </div>
          </li>

          <li>
            <p>CSS</p>

            <div>
              <button class="check">
                <i class="fa-solid fa-check" style="color: green"></i>
              </button>

              <button class="delete">
                <i class="fa-solid fa-trash" style="color: red"></i>
              </button>
            </div>
          </li>
        </ul>

        <button class="clearAll">Clear All</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
